name: ATProto Network Scan

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      duration_ms:
        description: 'Scan duration in milliseconds'
        required: false
        default: '300000'
      unauthenticated:
        description: 'Skip commit authentication (faster)'
        required: false
        default: 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # needed to upload/download artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download previous cursor (if exists)
        uses: actions/download-artifact@v4
        with:
          name: atproto-cursor
          path: ./cursor-artifact
        continue-on-error: true  # first run has no cursor

      - name: Restore cursor
        run: |
          if [ -f ./cursor-artifact/cursor.json ]; then
            cp ./cursor-artifact/cursor.json ./cursor.json
            echo "Cursor restored:"
            cat ./cursor.json
          else
            echo "No previous cursor found, starting from live tip"
          fi

      - name: Run scanner
        env:
          SCAN_DURATION_MS: ${{ github.event.inputs.duration_ms || '300000' }}
          OUTPUT_DIR: ./output
          CURSOR_FILE: ./cursor.json
          ATPROTO_SERVICE: wss://bsky.network
          ATPROTO_UNAUTHENTICATED: ${{ github.event.inputs.unauthenticated || 'true' }}
          # Optional: set these secrets for authenticated AppView API calls
          # ATPROTO_IDENTIFIER: ${{ secrets.ATPROTO_IDENTIFIER }}
          # ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: node dist/scanner.js

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atproto-scan-${{ github.run_number }}
          path: ./output/
          retention-days: 30

      - name: Upload cursor for next run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atproto-cursor
          path: ./cursor.json
          retention-days: 90
          overwrite: true

      - name: Print summary
        if: always()
        run: |
          if [ -f ./output/summary.json ]; then
            echo "=== Scan Summary ==="
            cat ./output/summary.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'Total events: {d[\"totalEvents\"]}')
          print(f'Last seq: {d[\"lastSeq\"]}')
          print(f'Collections seen: {len(d[\"collections\"])}')
          print()
          print('Top 20 collections:')
          for col, stats in list(d['collections'].items())[:20]:
              total = stats['creates'] + stats['updates'] + stats['deletes']
              print(f'  {col}: {total} events (+{stats[\"creates\"]} ~{stats[\"updates\"]} -{stats[\"deletes\"]})')
          "
          fi
