name: ATProto Feed Pull

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Posts per page (max 100)'
        required: false
        default: '100'
      max_pages:
        description: 'Max pages to fetch'
        required: false
        default: '1'

jobs:
  feed:
    runs-on: ubuntu-latest
    environment: scout-two
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Pull timeline and notifications
        env:
          ATPROTO_IDENTIFIER: ${{ vars.ATPROTO_IDENTIFIER }}
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
          ATPROTO_HTTP_SERVICE: https://bsky.social
          OUTPUT_DIR: ./output
          FEED_LIMIT: ${{ github.event.inputs.limit || '100' }}
          FEED_MAX_PAGES: ${{ github.event.inputs.max_pages || '1' }}
          CURSOR_FILE: ./feed-cursor.json

        run: node dist/feed.js

      - name: Commit cursor
        run: |
          git config user.email "scout-two@atproto-agent"
          git config user.name "Scout-Two"
          git add feed-cursor.json
          if git diff --staged --quiet; then
            echo "No cursor changes"
          else
            git commit -m "chore: update feed cursor $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload feed results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atproto-feed-${{ github.run_number }}
          path: ./output/
          retention-days: 30
