name: Update Scout-Two Core Memory

on:
  workflow_dispatch:
    inputs:
      block_label:
        description: 'Block label to update (leave empty to list all blocks)'
        required: false
        default: ''
      block_value:
        description: 'New value (replaces entire block). Use block_append instead to add to existing.'
        required: false
        default: ''
      block_append:
        description: 'Text to append to existing block value'
        required: false
        default: ''
      dry_run:
        description: 'Preview without writing'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  memory:
    runs-on: ubuntu-latest
    environment: scout-two
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: List blocks (no label provided)
        if: github.event.inputs.block_label == ''
        env:
          LETTA_BASE_URL: ${{ vars.LETTA_BASE_URL }}
          LETTA_AGENT_ID: ${{ vars.LETTA_AGENT_ID }}
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
        run: node dist/memory.js

      - name: Update block
        if: github.event.inputs.block_label != ''
        env:
          LETTA_BASE_URL: ${{ vars.LETTA_BASE_URL }}
          LETTA_AGENT_ID: ${{ vars.LETTA_AGENT_ID }}
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          BLOCK_LABEL: ${{ github.event.inputs.block_label }}
          BLOCK_VALUE: ${{ github.event.inputs.block_value }}
          BLOCK_APPEND: ${{ github.event.inputs.block_append }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node dist/memory.js
